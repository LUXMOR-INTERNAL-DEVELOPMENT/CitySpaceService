event.getActiveEvents=SELECT * FROM events WHERE status = 'ACTIVE'

user.getUserById=SELECT * FROM user WHERE user_id=?

user.updateUser=UPDATE user SET user_name=?, email=?, phoneno=?, password=?, user_location=?, updated_by=? WHERE user_id=?

user.updateUserStatus=UPDATE user SET status=? WHERE user_id=?


store.getActiveStoreEvents=SELECT * FROM events WHERE event_status = 'ACTIVE' AND category_id IS NOT NULL

store.getCategoryById=SELECT * FROM store_category WHERE category_id = ?

store.getStoreByCategory=SELECT * FROM events WHERE category_id = ? AND event_status = 'ACTIVE'

store.getProducts=SELECT * FROM store_product WHERE status = 'ACTIVE'

store.getProductsBySubcategory=SELECT * FROM store_product WHERE subcategory_id = ? AND status = 'ACTIVE'

store.updateBookingStatus=UPDATE store_booking SET booking_status = ?, updated_at = NOW() WHERE booking_id = ?
store.getProductById=SELECT * FROM store_product WHERE product_id = ? AND status = 'ACTIVE'




store.bookProduct=INSERT INTO store_booking (booking_id, user_id, product_id, quantity, unit_price, total_price, gst_percentage, gst_amount, final_amount, payment_method, payment_status, add_to_cart, product_removed, booking_status, booking_date, created_at, created_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, FALSE, FALSE, 'CONFIRMED', NOW(), NOW(), ?)




# ============================================================
# COUPON
# ============================================================

# COMMAND:
# Fetch all active coupons that are currently within their
# validity period.
coupon.getActiveCoupons=SELECT coupon_id, name, description, coupon_code, image, discount_display, discount_type, discount_value, minimum_booking_amount, maximum_discount, offer_type, valid_from, valid_until, status,category_id FROM coupon WHERE status = 'ACTIVE' AND valid_from <= CURDATE() AND valid_until >= CURDATE()


# COMMAND:
# Fetch one coupon using the coupon ID.
coupon.getCouponById=SELECT coupon_id, name, description, coupon_code, image, discount_display, discount_type, discount_value, minimum_booking_amount, maximum_discount, offer_type, valid_from, valid_until, category_id,status FROM coupon WHERE coupon_id = ?




# COMMAND:
# Fetch the booking using the unique booking ID.
# total_amount is the original amount used for coupon calculation.
coupon.getBookingById=SELECT booking_id, user_id, total_amount, booking_status FROM booking WHERE booking_id = ?


coupon.getApplicableDetails=SELECT c.coupon_code, ct.category_name, ct.category_type, ct.category_description, ct.category_price FROM coupon c JOIN category_table ct ON c.category_id = ct.category_id WHERE c.coupon_id = ? AND c.status = 'ACTIVE'









payment.insert=INSERT INTO payment (payment_id, booking_id, booking_amount, gst_percentage, gst_amount, convenience_fee, total_amount, payment_method, payment_status, transaction_id, payment_date) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)




store.getBookingHistoryByUserId=SELECT name, description, price FROM booking_history WHERE created_by = ?







store.addToCart=INSERT INTO store_cart (cart_id, user_id, product_id, quantity, added_at, created_at, created_by) VALUES (UUID(), ?, ?, ?, NOW(), NOW(), ?)

store.getCartByUserId=SELECT sp.product_name, sp.product_price FROM store_cart sc INNER JOIN store_product sp ON sc.product_id = sp.product_id WHERE sc.user_id = ?

store.updateCartQuantity=UPDATE store_cart SET quantity = ?, updated_at = NOW() WHERE cart_id = ?

store.deleteCartItem=DELETE FROM store_cart WHERE cart_id = ?







# Get cart items for booking
store.getCartItemsForBooking=SELECT sc.product_id, sp.product_name, sc.quantity, sp.product_price FROM store_cart sc INNER JOIN store_product sp ON sc.product_id = sp.product_id WHERE sc.user_id = ?
# Create parent booking
store.createBooking=INSERT INTO store_booking (booking_id, user_id, total_amount, booking_status, booking_date, created_at, created_by) VALUES (?, ?, ?, ?, NOW(), NOW(), ?)

# Create booking item
store.createBookingItem=INSERT INTO store_booking_item (booking_item_id, booking_id, product_id, quantity, unit_price, total_price, booking_status, booking_date, created_at, created_by) VALUES (?, ?, ?, ?, ?, ?, ?, NOW(), NOW(), ?)

# Clear user's cart
store.clearCart=DELETE FROM store_cart WHERE user_id = ?




# Get booking amount
store.getBookingAmount=SELECT total_amount FROM store_booking WHERE booking_id = ?

# Save payment details
store.savePayment=INSERT INTO payment (payment_id, booking_id, booking_amount, gst_percentage, gst_amount, convenience_fee, total_amount, payment_method, payment_status, transaction_id, payment_date) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, NOW())



store.getProductForBooking=SELECT product_id, product_name, product_price, available_quantity FROM store_product WHERE product_id = ? AND status = 'ACTIVE'


store.saveDeliveryDetails=INSERT INTO delivery_details (delivery_id, booking_id, recipient_name, phone_number, address, city, state, pincode, delivery_status, created_at, created_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, NOW(), ?)



store.checkBookingOwnership=SELECT COUNT(*) FROM store_booking WHERE booking_id = ? AND user_id = ?

store.insertBookingHistory=INSERT INTO booking_history (history_id, id, name, description, date, price, image, status, created_at, created_by) SELECT UUID(), sbi.product_id, sp.product_name, sp.product_description, DATE(sbi.booking_date), ROUND(sbi.total_price * 1.18, 2), sp.product_image, 'CONFIRMED', NOW(), sb.user_id FROM store_booking_item sbi INNER JOIN store_booking sb ON sbi.booking_id = sb.booking_id INNER JOIN store_product sp ON sbi.product_id = sp.product_id WHERE sbi.booking_id = ? AND sb.user_id = ? AND sbi.booking_status = 'CONFIRMED' AND sb.booking_status = 'CONFIRMED'