#get rating by eventId in review table
review.getRatingsByEventId=SELECT rating FROM review WHERE event_id = ?


store.getAllStores=SELECT e.event_id, e.event_name, e.event_image, e.event_location, sd.store_category, o.offer_text FROM event e INNER JOIN store_details sd ON e.event_id = sd.store_id LEFT JOIN offer o ON e.event_id = o.event_id AND o.status = 'ACTIVE' WHERE e.event_status = 'ACTIVE' AND sd.status = 'ACTIVE' AND e.category_id = 'Store04' GROUP BY e.event_id, e.event_name, e.event_image, e.event_location, sd.store_category, o.offer_text

store.getStoresDetails=SELECT e.event_id, e.event_name, e.event_image, e.event_location,e.event_description, sd.store_category, sd.catalogue, o.offer_text, COALESCE(ROUND(AVG(r.rating), 1), 0.0) AS average_rating, COUNT(r.id) AS total_reviews, SUM(CASE WHEN r.rating = 5 THEN 1 ELSE 0 END) AS five_star_count, SUM(CASE WHEN r.rating = 4 THEN 1 ELSE 0 END) AS four_star_count, SUM(CASE WHEN r.rating = 3 THEN 1 ELSE 0 END) AS three_star_count, SUM(CASE WHEN r.rating = 2 THEN 1 ELSE 0 END) AS two_star_count, SUM(CASE WHEN r.rating = 1 THEN 1 ELSE 0 END) AS one_star_count FROM event e INNER JOIN store_details sd ON e.event_id = sd.store_id LEFT JOIN offer o ON e.event_id = o.event_id AND o.status = 'ACTIVE' LEFT JOIN review r ON e.event_id = r.event_id WHERE e.event_id = ? AND e.event_status = 'ACTIVE' AND sd.status = 'ACTIVE' GROUP BY e.event_id, e.event_name, e.event_image, e.event_location, sd.store_category, sd.catalogue, o.offer_text

