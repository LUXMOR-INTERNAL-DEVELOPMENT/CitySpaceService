event.getAllByLocation=SELECT * FROM (SELECT e.*, 6371 * ACOS(LEAST(1.0, COS(RADIANS(?)) * COS(RADIANS(e.latitude)) * COS(RADIANS(e.longitude) - RADIANS(?)) + SIN(RADIANS(?)) * SIN(RADIANS(e.latitude)))) AS distance FROM event e) AS nearby WHERE nearby.distance <= ? 

event.getPopularEventsByRating=SELECT * FROM (SELECT nearby.*, ROW_NUMBER() OVER (PARTITION BY nearby.category_name ORDER BY nearby.rating DESC) AS rn FROM (SELECT e.*, 6371 * ACOS(LEAST(1.0, COS(RADIANS(?)) * COS(RADIANS(e.latitude)) * COS(RADIANS(e.longitude) - RADIANS(?)) + SIN(RADIANS(?)) * SIN(RADIANS(e.latitude)))) AS distance FROM event e) AS nearby WHERE nearby.distance <= ?) AS ranked WHERE ranked.rn = 1 ORDER BY ranked.distance ASC

event.getTopWeekendEventsByLocation=SELECT * FROM (SELECT nearby.*, ROW_NUMBER() OVER (PARTITION BY nearby.category_name ORDER BY nearby.rating DESC) AS rn FROM (SELECT e.*, 6371 * ACOS(LEAST(1.0, COS(RADIANS(?)) * COS(RADIANS(e.latitude)) * COS(RADIANS(e.longitude) - RADIANS(?)) + SIN(RADIANS(?)) * SIN(RADIANS(e.latitude)))) AS distance FROM event e WHERE LOWER(e.event_description) LIKE '%weekend%' OR LOWER(e.event_description) LIKE '%enjoy%' OR LOWER(e.event_description) LIKE '%outing%' OR LOWER(e.event_description) LIKE '%fun%') AS nearby WHERE nearby.distance <= ?) AS ranked WHERE ranked.rn = 1 ORDER BY ranked.rating DESC

user.getUserById=SELECT * FROM user WHERE user_id=?

user.updateUser=UPDATE user SET user_name=?, email=?, phoneno=?, password=?, updated_by=? WHERE user_id=?

user.updateUserStatus=UPDATE user SET status=? WHERE user_id=?