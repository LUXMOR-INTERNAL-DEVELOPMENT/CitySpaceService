

admin.getById=SELECT vendor_id, vendor_name, vendor_email, vendor_contact, vendor_location, vendor_password, bank_account_number, ifsc_code, account_holder_name, bank_name, pan, gst, rating, status, created_at, created_by, updated_at, updated_by FROM vendors WHERE vendor_id = ?

# Get Vendor Profile
vendor.getById=SELECT vendor_id, vendor_name, vendor_email, vendor_contact, vendor_location, vendor_password, bank_account_number, ifsc_code, account_holder_name, bank_name, pan, gst, rating, status, created_at, created_by, updated_at, updated_by FROM vendors WHERE vendor_id = ?

# Update Vendor Profile
vendor.update=UPDATE vendors SET vendor_name = ?, vendor_email = ?, vendor_contact = ?, vendor_location = ?, bank_account_number = ?, ifsc_code = ?, account_holder_name = ?, bank_name = ?, pan = ?, gst = ?, rating = ?, updated_at = NOW(), updated_by = ? WHERE vendor_id = ?

# Deactivate Vendor
vendor.deactivate=UPDATE vendors SET status = 'INACTIVE', updated_at = NOW(), updated_by = ? WHERE vendor_id = ?

vendor.existsById=SELECT COUNT(*) FROM vendors WHERE vendor_id = ?

event.create=INSERT INTO events (event_id, vendor_id, category_id, category_name, event_name, event_description, event_date, event_location, latitude, longitude, event_price, event_image, status, created_at, created_by, updated_at, updated_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, NOW(), ?, NULL, NULL)

# Get Events By Vendor ID
event.getByVendorId=SELECT event_id, vendor_id, category_id, category_name, event_name, event_description, event_date, event_location, latitude, longitude, event_price, event_image, status, created_at, created_by, updated_at, updated_by FROM events WHERE vendor_id = ?

# Get Event By Event ID
event.getById=SELECT event_id, vendor_id, category_id, category_name, event_name, event_description, event_date, event_location, latitude, longitude, event_price, event_image, status, created_at, created_by, updated_at, updated_by FROM events WHERE event_id = ?

# Update Event
event.update=UPDATE events SET category_id = ?, category_name = ?, event_name = ?, event_description = ?, event_date = ?, event_location = ?, latitude = ?, longitude = ?, event_price = ?, event_image = ?, status = ?, updated_at = NOW(), updated_by = ? WHERE event_id = ?

# Delete Event
event.delete=DELETE FROM events WHERE event_id = ?