#user-related queries

event.getActiveEvents=SELECT * FROM event WHERE event_status = 'ACTIVE'

event.getRatings=SELECT rating FROM review WHERE id = ? AND rating IS NOT NULL;

category.getCategories=SELECT * FROM category WHERE parent_category=? AND status='ACTIVE' ORDER BY display_order ASC

event.getDiningevent=SELECT * FROM event WHERE event_status = 'ACTIVE' AND id=?


user.getUserById=SELECT * FROM user WHERE user_id=? and status='ACTIVE'

user.updateUser=UPDATE user SET user_name=?, email=?, phoneno=?, password=?, user_location=?, updated_by=? WHERE user_id=?

user.updateUserStatus=UPDATE user SET status=? WHERE user_id=?
#review

review.postReview=INSERT INTO review (review_id, id, user_id, user_name, category_name, rating, review_comment, created_at, created_by, status) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

review.existsReviewByEventAndUserQuery=SELECT COUNT(*) FROM review WHERE id = ? AND user_id = ?

review.getLatestId=SELECT review_id FROM review WHERE review_id LIKE 'CSREW%' ORDER BY CAST(SUBSTRING(review_id, 6) AS UNSIGNED) DESC LIMIT 1

#review.getVendorEvents=SELECT id, event_name, event_location, event_status FROM event WHERE vendor_id = ?

#review.getAllReviewsByEvent=SELECT * FROM review WHERE id = ? AND status = 'ACTIVE' ORDER BY created_at DESC

review.getEventById=SELECT * FROM event WHERE id = ?
review.getAllReviewsByEvent=SELECT * FROM review WHERE id = ? AND status = 'ACTIVE' ORDER BY created_at DESC

review.updateStatus=UPDATE review SET status = ? WHERE review_id = ?

# Get Total Active Reviews for an Event
review.getTotalReviews=SELECT COUNT(*) FROM review WHERE id = ? AND status = 'ACTIVE'

# Get Total Distinct Customers Who Reviewed an Event
review.getTotalCustomers=SELECT COUNT(DISTINCT user_id) FROM review WHERE id = ? AND status = 'ACTIVE'

# Get Rating Breakdown (Round Decimal Ratings to Nearest Whole Star)
review.getRatingBreakdown=SELECT ROUND(rating) AS star_rating, COUNT(*) AS rating_count FROM review WHERE id = ? AND status = 'ACTIVE' AND rating IS NOT NULL AND rating >= 1 AND rating <= 5 GROUP BY ROUND(rating)

# Vendor Reply API
review.saveVendorReply=UPDATE review SET reply_comment = ? WHERE review_id = ? AND reply_comment IS NULL

# Dining detail

event.getOffers=SELECT offer_id,id,offer_title,offer_description,start_time,end_time,valid_all_day,booking_required,status,created_at,created_by,updated_at,updated_by FROM offer WHERE id=? AND status='ACTIVE'

event.getReviews=SELECT review_id,id,user_id,user_name,rating,review_comment,created_at,created_by FROM review WHERE id=?

event.getRestaurantDetails=SELECT details_id,id, cuisine, facilities, menu_images, created_at, created_by, updated_at, updated_by FROM restaurantdetails WHERE id=?

event.incrementClickCount=UPDATE event SET most_visited = COALESCE(most_visited, 0) + 1 WHERE id = ?

event.bookingDining=INSERT INTO booking(booking_id,user_id,id,vendor_id,booking_date,slot_id,number_of_guests,total_amount,booking_status,created_at,created_by,updated_at,updated_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

event.tableBooking=INSERT INTO bookingtableallocation(booking_table_allocation_id,booking_id,table_id,slot_id,booking_date,number_of_guests,booking_status) VALUES (?, ?, ?, ?, ?, ?, ?)

event.payment=INSERT INTO payment(payment_id,booking_id,booking_amount,gst_percentage,gst_amount,convenience_fee,total_amount,payment_method,payment_status,transaction_id,payment_date) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

event.getTimeSlot=SELECT slot_id,vendor_id,slot_start_time,slot_end_time,status FROM time_slot WHERE slot_id = ? AND vendor_id = ? AND status = 'ACTIVE'

event.getAvailableTables=SELECT rt.table_id, rt.vendor_id, rt.table_number, rt.capacity, rt.table_status FROM restaurant_table rt WHERE rt.vendor_id = ? AND rt.table_status = 'AVAILABLE' AND NOT EXISTS (SELECT 1 FROM bookingtableallocation bt WHERE bt.table_id = rt.table_id AND bt.booking_date = ? AND bt.slot_id = ? AND bt.booking_status IN ('RESERVED','BOOKED')) ORDER BY rt.capacity ASC, rt.table_id ASC

event.getTablesForUpdate=SELECT table_id,vendor_id,table_number,capacity,table_status FROM restaurant_table WHERE vendor_id = ? AND table_status = 'AVAILABLE' ORDER BY table_id FOR UPDATE

event.updateBookingStatus=UPDATE booking SET booking_status = ?, updated_at = ?, updated_by = ? WHERE booking_id = ?

event.updateTableBookingStatus=UPDATE bookingtableallocation SET booking_status = ? WHERE booking_id = ?

booking.getById=SELECT booking_id, user_id,id, vendor_id, booking_date, slot_id, number_of_guests, total_amount, booking_status, created_at, created_by, updated_at, updated_by FROM booking WHERE booking_id = ?

event.releaseBookingTables=UPDATE bookingtableallocation SET booking_status = 'CANCELLED' WHERE booking_id = ? AND booking_status = 'RESERVED'