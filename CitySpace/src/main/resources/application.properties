spring.application.name=CitySpace

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/CitySpace?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Properties
spring.config.import=optional:classpath:SQL.properties

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false